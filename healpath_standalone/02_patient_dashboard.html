<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HealPath — لوحة المريض</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Cairo',sans-serif;overflow-x:hidden}::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:rgba(0,102,255,0.3);border-radius:3px}button{cursor:pointer}</style>
</head>
<body><div id="root"></div>
<script type="text/babel">
const {useState}=React;
const Ic=({c,s=20,children,...r})=>(
  <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c||"currentColor"} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{flexShrink:0}}>{children}</svg>
);
const IcCalendar=({s,c})=><Ic s={s} c={c}><rect width="18" height="18" x="3" y="4" rx="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></Ic>;
const IcPill=({s,c})=><Ic s={s} c={c}><path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z"/><path d="m8.5 8.5 7 7"/></Ic>;
const IcBrain=({s,c})=><Ic s={s} c={c}><path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96-.46 2.5 2.5 0 0 1-1.49-4.26A3 3 0 0 1 5 14V8a3 3 0 0 1 .05-.52A2.5 2.5 0 0 1 7.5 2Z"/><path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96-.46 2.5 2.5 0 0 0 1.49-4.26A3 3 0 0 0 19 14V8a3 3 0 0 0-.05-.52A2.5 2.5 0 0 0 16.5 2Z"/></Ic>;
const IcBell=({s,c})=><Ic s={s} c={c}><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></Ic>;
const IcSearch=({s,c})=><Ic s={s} c={c}><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></Ic>;
const IcLayout=({s,c})=><Ic s={s} c={c}><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></Ic>;
const IcUsers=({s,c})=><Ic s={s} c={c}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></Ic>;
const IcBriefcase=({s,c})=><Ic s={s} c={c}><rect width="20" height="14" x="2" y="7" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/><line x1="12" x2="12" y1="12" y2="16"/><line x1="10" x2="14" y1="14" y2="14"/></Ic>;
const IcFileText=({s,c})=><Ic s={s} c={c}><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/></Ic>;
const IcChevronDown=({s,c})=><Ic s={s} c={c}><path d="m6 9 6 6 6-6"/></Ic>;
const IcClock=({s,c})=><Ic s={s} c={c}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></Ic>;
const IcCheck=({s,c})=><Ic s={s} c={c}><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></Ic>;
const IcActivity=({s,c})=><Ic s={s} c={c}><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></Ic>;
const IcMoon=({s,c})=><Ic s={s} c={c}><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></Ic>;
const IcSun=({s,c})=><Ic s={s} c={c}><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></Ic>;
const IcX=({s,c})=><Ic s={s} c={c}><path d="M18 6 6 18M6 6l12 12"/></Ic>;

const Logo=()=>(
  <div style={{display:"flex",alignItems:"center",gap:10}}>
    <div style={{width:36,height:36,background:"linear-gradient(135deg,#0066FF,#00A3FF)",borderRadius:10,display:"flex",alignItems:"center",justifyContent:"center"}}>
      <svg width="20" height="14" viewBox="0 0 22 16" fill="none"><path d="M1 8 L4 8 L6 3 L8 13 L10 6 L12 10 L14 8 L21 8" stroke="white" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>
    </div>
    <div>
      <div style={{color:"white",fontWeight:800,fontSize:17,lineHeight:1}}>HealPath</div>
      <div style={{color:"#60A5FA",fontSize:10}}>مسار الشفاء</div>
    </div>
  </div>
);

const navLinks=[{id:"dashboard",label:"الرئيسية",Icon:IcLayout},{id:"doctors",label:"الأطباء",Icon:IcUsers},{id:"appointments",label:"مواعيدي",Icon:IcCalendar},{id:"pharmacy",label:"الصيدلية",Icon:IcPill},{id:"recruitment",label:"التوظيف",Icon:IcBriefcase},{id:"articles",label:"المقالات",Icon:IcFileText}];

function App(){
  const [dark,setDark]=useState(false);
  const [activeTab,setActiveTab]=useState("dashboard");
  const [aiOpen,setAiOpen]=useState(false);

  const bg=dark?"#0F1621":"#F0F6FF";
  const card=dark?"#1E2A3A":"#FFFFFF";
  const text=dark?"#E8F0FE":"#1A1A2E";
  const text2=dark?"#94A3B8":"#6B7280";
  const border=dark?"#2A3A4A":"#E5EEFF";

  return(
    <div dir="rtl" style={{background:bg,color:text,minHeight:"100vh",fontFamily:"'Cairo',sans-serif",display:"flex",flexDirection:"column"}}>
      {/* NAVBAR */}
      <nav style={{background:"#1A1A2E",position:"sticky",top:0,zIndex:50,borderBottom:"1px solid #0A1628"}}>
        <div style={{maxWidth:1280,margin:"0 auto",padding:"0 24px",height:64,display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <Logo/>
          <div style={{display:"flex",alignItems:"center",gap:4}}>
            {["الرئيسية","الأطباء","الصيدلية","التوظيف","المقالات"].map((l,i)=>(
              <a key={i} href="#" style={{color:i===0?"#60A5FA":"#CBD5E1",padding:"6px 14px",borderRadius:8,fontSize:14,fontWeight:500,background:i===0?"rgba(96,165,250,0.12)":"transparent",textDecoration:"none"}}>{l}</a>
            ))}
          </div>
          <div style={{display:"flex",alignItems:"center",gap:8}}>
            <button onClick={()=>setDark(!dark)} style={{width:36,height:36,background:"rgba(255,255,255,0.1)",border:"1px solid rgba(255,255,255,0.15)",borderRadius:8,color:"white",display:"flex",alignItems:"center",justifyContent:"center"}}>
              {dark?<IcSun s={16} c="white"/>:<IcMoon s={16} c="white"/>}
            </button>
            <button style={{width:36,height:36,background:"rgba(255,255,255,0.1)",border:"1px solid rgba(255,255,255,0.15)",borderRadius:8,color:"white",position:"relative",display:"flex",alignItems:"center",justifyContent:"center"}}>
              <IcBell s={16} c="white"/>
              <span style={{position:"absolute",top:6,left:6,width:7,height:7,background:"#EF4444",borderRadius:"50%"}}/>
            </button>
            <button style={{background:"linear-gradient(135deg,#0066FF,#0052CC)",border:"none",color:"white",padding:"7px 16px",borderRadius:8,fontSize:13,fontWeight:600}}>حالة طوارئ</button>
          </div>
        </div>
      </nav>

      <div style={{display:"flex",flex:1,overflow:"hidden"}}>
        {/* SIDEBAR */}
        <aside style={{width:240,background:"#1A1A2E",display:"flex",flexDirection:"column",height:"calc(100vh - 64px)",position:"sticky",top:64,flexShrink:0}}>
          <div style={{flex:1,padding:"20px 12px",overflowY:"auto"}}>
            {navLinks.map(({id,label,Icon})=>{
              const active=activeTab===id;
              return(
                <button key={id} onClick={()=>setActiveTab(id)} style={{width:"100%",display:"flex",alignItems:"center",gap:12,padding:"10px 14px",borderRadius:10,border:"none",cursor:"pointer",marginBottom:4,background:active?"rgba(0,102,255,0.2)":"transparent",color:active?"#60A5FA":"#94A3B8",fontFamily:"'Cairo',sans-serif",fontSize:14,fontWeight:active?700:500,textAlign:"right"}}>
                  <Icon s={18} c={active?"#60A5FA":"#64748B"}/>
                  {label}
                  {active&&<div style={{marginRight:"auto",width:6,height:6,background:"#0066FF",borderRadius:"50%"}}/>}
                </button>
              );
            })}
          </div>
          <div style={{padding:"16px 12px",borderTop:"1px solid rgba(255,255,255,0.08)"}}>
            <div style={{display:"flex",alignItems:"center",gap:10,padding:"10px 12px",borderRadius:12,background:"rgba(255,255,255,0.06)"}}>
              <div style={{width:36,height:36,background:"linear-gradient(135deg,#0066FF,#00A3FF)",borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",color:"white",fontWeight:800,fontSize:14,flexShrink:0}}>إب</div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{color:"white",fontWeight:700,fontSize:13,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>إبراهيم عبدالله</div>
                <div style={{color:"#64748B",fontSize:11}}>مريض</div>
              </div>
              <IcChevronDown s={14} c="#64748B"/>
            </div>
          </div>
        </aside>

        {/* MAIN */}
        <main style={{flex:1,overflowY:"auto",background:bg}}>
          <header style={{background:card,borderBottom:`1px solid ${border}`,height:64,display:"flex",alignItems:"center",justifyContent:"space-between",padding:"0 24px",position:"sticky",top:0,zIndex:20}}>
            <div style={{position:"relative",width:320}}>
              <IcSearch s={16} c={text2} style={{position:"absolute",top:"50%",transform:"translateY(-50%)",right:12}}/>
              <input placeholder="ابحث عن طبيب أو دواء..." style={{width:"100%",background:bg,border:`1px solid ${border}`,borderRadius:24,padding:"9px 36px 9px 12px",fontSize:13,color:text,outline:"none",fontFamily:"'Cairo',sans-serif"}}/>
            </div>
            <button style={{background:"linear-gradient(135deg,#0066FF,#0052CC)",border:"none",color:"white",padding:"8px 18px",borderRadius:8,fontSize:13,fontWeight:700}}>حالة طوارئ</button>
          </header>

          <div style={{padding:32,maxWidth:1100,margin:"0 auto"}}>
            {/* WELCOME */}
            <div style={{marginBottom:32}}>
              <h1 style={{fontSize:28,fontWeight:800,marginBottom:6}}>مرحباً إبراهيم 👋</h1>
              <p style={{color:text2,fontSize:14}}>{new Date().toLocaleDateString("ar-SA",{weekday:"long",year:"numeric",month:"long",day:"numeric"})}</p>
            </div>

            {/* QUICK ACTIONS */}
            <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:20,marginBottom:32}}>
              {[
                {Icon:IcCalendar,label:"احجز موعداً",sub:"استعرض الأطباء المتاحين",gradient:"linear-gradient(135deg,#0066FF,#0052CC)",white:true},
                {Icon:IcPill,label:"الصيدلية الإلكترونية",sub:"اطلب أدويتك بسهولة",gradient:null,white:false},
                {Icon:IcBrain,label:"المساعد الذكي",sub:"تحليل الأعراض فوراً",gradient:null,white:false},
              ].map((c,i)=>(
                <div key={i} style={{background:c.gradient||card,border:`1px solid ${border}`,borderRadius:16,padding:24,cursor:"pointer",boxShadow:dark?"none":"0 2px 12px rgba(0,0,0,0.06)"}}>
                  <div style={{width:48,height:48,background:c.white?"rgba(255,255,255,0.2)":"rgba(0,102,255,0.1)",borderRadius:14,display:"flex",alignItems:"center",justifyContent:"center",marginBottom:16}}>
                    <c.Icon s={22} c={c.white?"white":"#0066FF"}/>
                  </div>
                  <div style={{fontWeight:800,fontSize:16,color:c.white?"white":text,marginBottom:6}}>{c.label}</div>
                  <div style={{fontSize:13,color:c.white?"rgba(255,255,255,0.75)":text2}}>{c.sub}</div>
                </div>
              ))}
            </div>

            <div style={{display:"grid",gridTemplateColumns:"2fr 1fr",gap:24}}>
              {/* NEXT APPOINTMENT */}
              <div>
                <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16}}>
                  <h2 style={{fontSize:18,fontWeight:800}}>الموعد القادم</h2>
                  <button style={{color:"#0066FF",background:"none",border:"none",fontSize:13,fontWeight:600}}>عرض الكل</button>
                </div>
                <div style={{background:card,border:`1px solid ${border}`,borderRadius:16,overflow:"hidden",boxShadow:dark?"none":"0 2px 12px rgba(0,0,0,0.06)"}}>
                  <div style={{height:4,background:"linear-gradient(90deg,#0066FF,#00A3FF)"}}/>
                  <div style={{padding:24}}>
                    <div style={{display:"flex",gap:16,marginBottom:20}}>
                      <div style={{width:64,height:64,background:"linear-gradient(135deg,#0066FF,#00A3FF)",borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",color:"white",fontWeight:800,fontSize:18,flexShrink:0}}>د.أ</div>
                      <div>
                        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}>
                          <span style={{background:"#D1FAE5",color:"#059669",fontSize:11,fontWeight:700,padding:"3px 8px",borderRadius:20,display:"flex",alignItems:"center",gap:4}}>
                            <IcCheck s={10} c="#059669"/>مؤكد
                          </span>
                        </div>
                        <div style={{fontWeight:800,fontSize:17,marginBottom:4}}>د. أحمد محمود</div>
                        <div style={{color:"#0066FF",fontSize:13,fontWeight:600}}>استشاري أمراض القلب</div>
                      </div>
                    </div>
                    <div style={{display:"flex",gap:10,flexWrap:"wrap",marginBottom:20}}>
                      {[{I:IcCalendar,t:"الخميس، 29 مايو 2026"},{I:IcClock,t:"10:00 صباحاً"}].map(({I,t},i)=>(
                        <div key={i} style={{display:"flex",alignItems:"center",gap:6,background:bg,border:`1px solid ${border}`,borderRadius:8,padding:"6px 12px",fontSize:13,color:text2}}>
                          <I s={14} c="#0066FF"/>{t}
                        </div>
                      ))}
                    </div>
                    <div style={{display:"flex",gap:10}}>
                      <button style={{flex:1,background:"linear-gradient(135deg,#1A1A2E,#0F3460)",color:"white",border:"none",padding:"10px",borderRadius:10,fontSize:13,fontWeight:700}}>تفاصيل الموعد</button>
                      <button style={{flex:1,background:"transparent",color:text,border:`1px solid ${border}`,padding:"10px",borderRadius:10,fontSize:13,fontWeight:600}}>إعادة جدولة</button>
                      <button style={{padding:"10px 14px",background:"transparent",color:"#EF4444",border:"1px solid #FEE2E2",borderRadius:10,fontSize:13,fontWeight:600}}>إلغاء</button>
                    </div>
                  </div>
                </div>
              </div>

              {/* ACTIVITY */}
              <div>
                <h2 style={{fontSize:18,fontWeight:800,marginBottom:16}}>النشاط الأخير</h2>
                <div style={{background:card,border:`1px solid ${border}`,borderRadius:16,padding:20,boxShadow:dark?"none":"0 2px 12px rgba(0,0,0,0.06)"}}>
                  {[
                    {I:IcCalendar,c:"#3B82F6",bg:"#EFF6FF",l:"تم حجز موعد",s:"مع د. أحمد محمود",t:"منذ ساعتين"},
                    {I:IcPill,c:"#10B981",bg:"#ECFDF5",l:"توصيل الأدوية",s:"طلب رقم #49281",t:"أمس"},
                    {I:IcBrain,c:"#8B5CF6",bg:"#F5F3FF",l:"استشارة المساعد",s:"تحليل أعراض الصداع",t:"12 مايو"},
                  ].map((item,i)=>(
                    <div key={i} style={{display:"flex",alignItems:"flex-start",gap:12,marginBottom:i<2?20:0}}>
                      <div style={{width:40,height:40,background:dark?"#1A2332":item.bg,borderRadius:12,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                        <item.I s={18} c={item.c}/>
                      </div>
                      <div style={{flex:1}}>
                        <div style={{fontWeight:700,fontSize:13,marginBottom:2}}>{item.l}</div>
                        <div style={{fontSize:12,color:text2,marginBottom:2}}>{item.s}</div>
                        <div style={{fontSize:11,color:text2}}>{item.t}</div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          </div>
        </main>
      </div>

      {/* AI FLOAT */}
      <div style={{position:"fixed",bottom:28,left:28,zIndex:100}}>
        <div style={{position:"absolute",inset:-6,borderRadius:"50%",background:"rgba(0,102,255,0.25)",animation:"pulse 2s ease-out infinite"}}/>
        <button onClick={()=>setAiOpen(!aiOpen)} style={{width:56,height:56,background:"linear-gradient(135deg,#0066FF,#0052CC)",border:"none",borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",boxShadow:"0 4px 24px rgba(0,102,255,0.5)",position:"relative"}}>
          {aiOpen?<IcX s={20} c="white"/>:<IcBrain s={20} c="white"/>}
        </button>
        <div style={{textAlign:"center",marginTop:6,color:"#0066FF",fontSize:10,fontWeight:700}}>المساعد الطبي</div>
      </div>
      <style>{`@keyframes pulse{0%{transform:scale(0.95);opacity:0.7}70%{transform:scale(1.2);opacity:0}100%{transform:scale(1.2);opacity:0}}`}</style>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
