<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HealPath — الصيدلية الإلكترونية</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Cairo',sans-serif}::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:rgba(0,102,255,0.3);border-radius:3px}button{cursor:pointer}a{text-decoration:none}</style>
</head>
<body><div id="root"></div>
<script type="text/babel">
const {useState}=React;
const Ic=({c,s=20,children})=>(
  <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c||"currentColor"} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{flexShrink:0}}>{children}</svg>
);
const IcSearch=({s,c})=><Ic s={s} c={c}><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></Ic>;
const IcCart=({s,c})=><Ic s={s} c={c}><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></Ic>;
const IcPill=({s,c})=><Ic s={s} c={c}><path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z"/><path d="m8.5 8.5 7 7"/></Ic>;
const IcPlus=({s,c})=><Ic s={s} c={c}><path d="M5 12h14M12 5v14"/></Ic>;
const IcMinus=({s,c})=><Ic s={s} c={c}><path d="M5 12h14"/></Ic>;
const IcX=({s,c})=><Ic s={s} c={c}><path d="M18 6 6 18M6 6l12 12"/></Ic>;
const IcCard=({s,c})=><Ic s={s} c={c}><rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/></Ic>;
const IcMap=({s,c})=><Ic s={s} c={c}><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></Ic>;
const IcMoon=({s,c})=><Ic s={s} c={c}><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></Ic>;
const IcSun=({s,c})=><Ic s={s} c={c}><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></Ic>;
const IcBell=({s,c})=><Ic s={s} c={c}><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></Ic>;

const MEDS=[
  {id:1,name:"باراسيتامول 500mg",sci:"Paracetamol",price:2500,inStock:true,cat:"مسكنات",color:"#3B82F6"},
  {id:2,name:"أموكسيسيلين 250mg",sci:"Amoxicillin",price:4500,inStock:true,cat:"مضادات حيوية",color:"#10B981"},
  {id:3,name:"فيتامين C 1000mg",sci:"Ascorbic Acid",price:3500,inStock:false,cat:"فيتامينات",color:"#F59E0B"},
  {id:4,name:"أسبرين 100mg",sci:"Aspirin",price:1500,inStock:true,cat:"قلب وضغط",color:"#EF4444"},
  {id:5,name:"أملوديبين 5mg",sci:"Amlodipine",price:5500,inStock:true,cat:"قلب وضغط",color:"#8B5CF6"},
  {id:6,name:"ميتفورمين 500mg",sci:"Metformin",price:3000,inStock:true,cat:"سكري",color:"#06B6D4"},
];
const CATS=["الكل","مسكنات","مضادات حيوية","فيتامينات","قلب وضغط","سكري"];
const INIT_CART=[{...MEDS[0],qty:2},{...MEDS[1],qty:1},{...MEDS[3],qty:1}];

function App(){
  const [dark,setDark]=useState(false);
  const [tab,setTab]=useState("الكل");
  const [cart,setCart]=useState(INIT_CART);
  const [delivery,setDelivery]=useState("delivery");
  const [ordered,setOrdered]=useState(false);

  const bg=dark?"#0F1621":"#F0F6FF";
  const card=dark?"#1E2A3A":"#FFFFFF";
  const text=dark?"#E8F0FE":"#1A1A2E";
  const text2=dark?"#94A3B8":"#6B7280";
  const border=dark?"#2A3A4A":"#E5EEFF";

  const subtotal=cart.reduce((s,i)=>s+i.price*i.qty,0);
  const deliveryFee=delivery==="delivery"?1500:0;

  const changeQty=(id,delta)=>setCart(c=>c.map(i=>i.id===id?{...i,qty:Math.max(1,i.qty+delta)}:i));
  const removeItem=(id)=>setCart(c=>c.filter(i=>i.id!==id));
  const addToCart=(med)=>{
    if(cart.find(i=>i.id===med.id)) changeQty(med.id,1);
    else setCart(c=>[...c,{...med,qty:1}]);
  };

  return(
    <div dir="rtl" style={{background:bg,color:text,minHeight:"100vh",fontFamily:"'Cairo',sans-serif"}}>
      {/* NAV */}
      <nav style={{background:"#1A1A2E",position:"sticky",top:0,zIndex:50,borderBottom:"1px solid #0A1628"}}>
        <div style={{maxWidth:1280,margin:"0 auto",padding:"0 24px",height:64,display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <div style={{width:36,height:36,background:"linear-gradient(135deg,#0066FF,#00A3FF)",borderRadius:10,display:"flex",alignItems:"center",justifyContent:"center"}}>
              <svg width="20" height="14" viewBox="0 0 22 16" fill="none"><path d="M1 8 L4 8 L6 3 L8 13 L10 6 L12 10 L14 8 L21 8" stroke="white" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>
            </div>
            <div><div style={{color:"white",fontWeight:800,fontSize:17,lineHeight:1}}>HealPath</div><div style={{color:"#60A5FA",fontSize:10}}>مسار الشفاء</div></div>
          </div>
          <div style={{display:"flex",gap:4}}>
            {["الرئيسية","الأطباء","الصيدلية","التوظيف","المقالات"].map((l,i)=>(
              <a key={i} href="#" style={{color:i===2?"#60A5FA":"#CBD5E1",padding:"6px 14px",borderRadius:8,fontSize:14,background:i===2?"rgba(96,165,250,0.12)":"transparent"}}>{l}</a>
            ))}
          </div>
          <div style={{display:"flex",gap:8}}>
            <button onClick={()=>setDark(!dark)} style={{width:36,height:36,background:"rgba(255,255,255,0.1)",border:"1px solid rgba(255,255,255,0.15)",borderRadius:8,display:"flex",alignItems:"center",justifyContent:"center"}}>
              {dark?<IcSun s={16} c="white"/>:<IcMoon s={16} c="white"/>}
            </button>
            <button style={{position:"relative",width:36,height:36,background:"rgba(255,255,255,0.1)",border:"1px solid rgba(255,255,255,0.15)",borderRadius:8,display:"flex",alignItems:"center",justifyContent:"center"}}>
              <IcBell s={16} c="white"/>
              <span style={{position:"absolute",top:5,left:5,width:7,height:7,background:"#EF4444",borderRadius:"50%"}}/>
            </button>
            <button style={{background:"transparent",border:"1px solid rgba(255,255,255,0.3)",color:"white",padding:"7px 16px",borderRadius:8,fontSize:13,fontWeight:600}}>تسجيل الدخول</button>
          </div>
        </div>
      </nav>

      <div style={{display:"flex",position:"relative"}}>
        {/* MAIN */}
        <main style={{flex:1,marginLeft:320,minHeight:"calc(100vh - 64px)",overflowY:"auto"}}>
          <div style={{maxWidth:900,margin:"0 auto",padding:"32px 24px"}}>
            {/* HERO */}
            <div style={{background:"linear-gradient(135deg,#1A1A2E,#0F3460)",borderRadius:20,padding:"32px 28px",marginBottom:28,position:"relative",overflow:"hidden"}}>
              <div style={{position:"absolute",inset:0,backgroundImage:"radial-gradient(rgba(0,102,255,0.15) 1px,transparent 1px)",backgroundSize:"20px 20px",pointerEvents:"none"}}/>
              <h1 style={{color:"white",fontSize:26,fontWeight:800,marginBottom:8,position:"relative"}}>الصيدلية الإلكترونية</h1>
              <p style={{color:"#93C5FD",fontSize:15,marginBottom:24,position:"relative"}}>اطلب دواءك بسهولة وأمان — توصيل سريع لجميع المناطق</p>
              <div style={{position:"relative",display:"flex",alignItems:"center",gap:8}}>
                <div style={{flex:1,position:"relative"}}>
                  <IcSearch s={18} c="#9CA3AF" style={{position:"absolute",top:"50%",transform:"translateY(-50%)",right:14}}/>
                  <input placeholder="ابحث عن دواء..." style={{width:"100%",height:48,background:"white",border:"none",borderRadius:12,padding:"0 44px 0 16px",fontSize:14,color:"#1A1A2E",outline:"none",boxSizing:"border-box",fontFamily:"'Cairo',sans-serif"}}/>
                </div>
                <button style={{height:48,padding:"0 24px",background:"linear-gradient(135deg,#0066FF,#0052CC)",color:"white",border:"none",borderRadius:12,fontSize:14,fontWeight:700}}>بحث</button>
              </div>
            </div>

            {/* CATS */}
            <div style={{display:"flex",gap:8,marginBottom:24,flexWrap:"wrap"}}>
              {CATS.map(c=>(
                <button key={c} onClick={()=>setTab(c)} style={{padding:"7px 18px",borderRadius:24,fontSize:13,fontWeight:600,background:tab===c?"linear-gradient(135deg,#0066FF,#0052CC)":card,color:tab===c?"white":text2,boxShadow:tab===c?"0 4px 12px rgba(0,102,255,0.3)":"none",border:`1px solid ${tab===c?"transparent":border}`}}>
                  {c}
                </button>
              ))}
            </div>

            {/* PRODUCTS */}
            <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:16}}>
              {MEDS.filter(m=>tab==="الكل"||m.cat===tab).map(med=>(
                <div key={med.id} style={{background:card,border:`1px solid ${border}`,borderRadius:16,overflow:"hidden",boxShadow:dark?"none":"0 2px 8px rgba(0,0,0,0.06)"}}>
                  <div style={{height:140,background:dark?"#1A2332":`linear-gradient(135deg,${med.color}18,${med.color}08)`,display:"flex",alignItems:"center",justifyContent:"center",position:"relative"}}>
                    <span style={{position:"absolute",top:10,right:10,background:med.inStock?"#D1FAE5":"#FEE2E2",color:med.inStock?"#059669":"#DC2626",fontSize:11,fontWeight:700,padding:"4px 8px",borderRadius:8}}>
                      {med.inStock?"متوفر":"نفد المخزون"}
                    </span>
                    <div style={{width:72,height:72,background:dark?"rgba(255,255,255,0.08)":"white",borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",boxShadow:"0 4px 12px rgba(0,0,0,0.1)"}}>
                      <IcPill s={32} c={med.color}/>
                    </div>
                  </div>
                  <div style={{padding:16}}>
                    <div style={{fontWeight:700,fontSize:15,marginBottom:2}}>{med.name}</div>
                    <div style={{fontSize:12,color:text2,marginBottom:14,fontStyle:"italic"}}>{med.sci}</div>
                    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
                      <span style={{fontWeight:800,fontSize:16,color:"#0066FF"}}>{med.price.toLocaleString()} ل.س</span>
                      <button disabled={!med.inStock} onClick={()=>addToCart(med)} style={{display:"flex",alignItems:"center",gap:6,padding:"7px 14px",background:med.inStock?"linear-gradient(135deg,#1A1A2E,#0F3460)":"#F3F4F6",color:med.inStock?"white":"#9CA3AF",border:"none",borderRadius:10,fontSize:13,fontWeight:700,cursor:med.inStock?"pointer":"not-allowed"}}>
                        <IcCart s={14} c={med.inStock?"white":"#9CA3AF"}/>أضف
                      </button>
                    </div>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </main>

        {/* CART */}
        <aside style={{position:"fixed",top:64,left:0,bottom:0,width:320,background:card,borderRight:`1px solid ${border}`,display:"flex",flexDirection:"column",zIndex:30,boxShadow:dark?"none":"4px 0 20px rgba(0,0,0,0.08)"}}>
          <div style={{padding:"16px 20px",borderBottom:`1px solid ${border}`,display:"flex",alignItems:"center",justifyContent:"space-between"}}>
            <div style={{display:"flex",alignItems:"center",gap:8,fontWeight:800,fontSize:16}}>
              <IcCart s={18} c="#0066FF"/>السلة
              <span style={{background:"#0066FF",color:"white",width:20,height:20,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:800}}>{cart.length}</span>
            </div>
          </div>
          {ordered?(
            <div style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:24,textAlign:"center"}}>
              <div style={{width:70,height:70,background:"linear-gradient(135deg,#10B981,#059669)",borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",marginBottom:16}}>
                <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>
              </div>
              <h3 style={{fontWeight:800,fontSize:18,marginBottom:8}}>تم استلام طلبك! ✅</h3>
              <p style={{color:text2,fontSize:13,lineHeight:1.7,marginBottom:20}}>سيتم التواصل معك لتأكيد الموعد والعنوان</p>
              <div style={{background:bg,border:`1px solid ${border}`,borderRadius:12,padding:"12px 16px",marginBottom:20,width:"100%",textAlign:"right"}}>
                <div style={{fontSize:12,color:text2,marginBottom:4}}>رقم الطلب</div>
                <div style={{fontWeight:800,color:"#0066FF"}}>#PH-2026-8834</div>
              </div>
              <button onClick={()=>setOrdered(false)} style={{background:"linear-gradient(135deg,#0066FF,#0052CC)",color:"white",border:"none",padding:"10px 24px",borderRadius:10,fontSize:14,fontWeight:700,width:"100%"}}>طلب جديد</button>
            </div>
          ):(
            <>
              <div style={{flex:1,overflowY:"auto",padding:16,display:"flex",flexDirection:"column",gap:12}}>
                {cart.map(item=>(
                  <div key={item.id} style={{display:"flex",gap:12,background:bg,borderRadius:14,padding:12,border:`1px solid ${border}`}}>
                    <div style={{width:44,height:44,background:card,borderRadius:10,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,border:`1px solid ${border}`}}>
                      <IcPill s={20} c={item.color}/>
                    </div>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontWeight:700,fontSize:13,marginBottom:2,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{item.name}</div>
                      <div style={{color:"#0066FF",fontWeight:700,fontSize:13,marginBottom:8}}>{item.price.toLocaleString()} ل.س</div>
                      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
                        <div style={{display:"flex",alignItems:"center",gap:8,background:card,border:`1px solid ${border}`,borderRadius:8,padding:"4px 8px"}}>
                          <button onClick={()=>changeQty(item.id,-1)} style={{background:"none",border:"none",color:text2,lineHeight:1,display:"flex",alignItems:"center"}}><IcMinus s={12} c={text2}/></button>
                          <span style={{fontWeight:700,fontSize:13,width:16,textAlign:"center"}}>{item.qty}</span>
                          <button onClick={()=>changeQty(item.id,1)} style={{background:"none",border:"none",color:text2,lineHeight:1,display:"flex",alignItems:"center"}}><IcPlus s={12} c={text2}/></button>
                        </div>
                        <button onClick={()=>removeItem(item.id)} style={{background:"none",border:"none",color:"#EF4444",fontSize:12,fontWeight:600}}>حذف</button>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
              <div style={{padding:16,borderTop:`1px solid ${border}`,background:bg}}>
                <div style={{fontWeight:700,fontSize:13,marginBottom:10}}>طريقة الاستلام</div>
                {["delivery","pickup"].map(opt=>(
                  <label key={opt} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 14px",borderRadius:10,marginBottom:6,border:`1px solid ${delivery===opt?"#0066FF":border}`,background:delivery===opt?(dark?"rgba(0,102,255,0.1)":"#EFF6FF"):card,cursor:"pointer"}}>
                    <input type="radio" name="del" checked={delivery===opt} onChange={()=>setDelivery(opt)} style={{accentColor:"#0066FF"}}/>
                    <IcMap s={14} c={delivery===opt?"#0066FF":text2}/>
                    <span style={{fontSize:13,fontWeight:600,color:delivery===opt?"#0066FF":text}}>
                      {opt==="delivery"?"توصيل للمنزل":"استلام من الصيدلية"}
                    </span>
                  </label>
                ))}
                <div style={{marginBottom:16,marginTop:16}}>
                  {[["المجموع الفرعي",`${subtotal.toLocaleString()} ل.س`],["التوصيل",delivery==="delivery"?"1,500 ل.س":"مجاناً"]].map(([k,v],i)=>(
                    <div key={i} style={{display:"flex",justifyContent:"space-between",marginBottom:8,fontSize:13,color:text2}}>
                      <span>{k}</span><span style={{fontWeight:600}}>{v}</span>
                    </div>
                  ))}
                  <div style={{display:"flex",justifyContent:"space-between",paddingTop:10,borderTop:`1px solid ${border}`,fontSize:16,fontWeight:800}}>
                    <span>الإجمالي</span>
                    <span style={{color:"#0066FF"}}>{(subtotal+deliveryFee).toLocaleString()} ل.س</span>
                  </div>
                </div>
                <button onClick={()=>setOrdered(true)} style={{width:"100%",background:"linear-gradient(135deg,#0066FF,#0052CC)",color:"white",border:"none",padding:14,borderRadius:14,fontSize:15,fontWeight:800,display:"flex",alignItems:"center",justifyContent:"center",gap:8,boxShadow:"0 6px 20px rgba(0,102,255,0.35)"}}>
                  <IcCard s={16} c="white"/>إتمام الطلب
                </button>
              </div>
            </>
          )}
        </aside>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
