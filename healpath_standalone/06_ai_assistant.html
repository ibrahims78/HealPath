<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HealPath — المساعد الطبي الذكي</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Cairo',sans-serif}::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:rgba(0,102,255,0.3);border-radius:3px}button{cursor:pointer}</style>
</head>
<body><div id="root"></div>
<script type="text/babel">
const {useState}=React;
const Ic=({c,s=20,children})=>(
  <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c||"currentColor"} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{flexShrink:0}}>{children}</svg>
);
const IcBrain=({s,c})=><Ic s={s} c={c}><path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96-.46 2.5 2.5 0 0 1-1.49-4.26A3 3 0 0 1 5 14V8a3 3 0 0 1 .05-.52A2.5 2.5 0 0 1 7.5 2Z"/><path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96-.46 2.5 2.5 0 0 0 1.49-4.26A3 3 0 0 0 19 14V8a3 3 0 0 0-.05-.52A2.5 2.5 0 0 0 16.5 2Z"/></Ic>;
const IcActivity=({s,c})=><Ic s={s} c={c}><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></Ic>;
const IcPill=({s,c})=><Ic s={s} c={c}><path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z"/><path d="m8.5 8.5 7 7"/></Ic>;
const IcFileText=({s,c})=><Ic s={s} c={c}><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/></Ic>;
const IcSend=({s,c})=><Ic s={s} c={c}><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></Ic>;
const IcImage=({s,c})=><Ic s={s} c={c}><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></Ic>;
const IcCalendar=({s,c})=><Ic s={s} c={c}><rect width="18" height="18" x="3" y="4" rx="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></Ic>;
const IcBone=({s,c})=><Ic s={s} c={c}><path d="M17 10c.7-.7 1.69 0 2.5 0a2.5 2.5 0 1 0 0-5 .5.5 0 0 1-.5-.5 2.5 2.5 0 1 0-5 0c0 .81.7 1.8 0 2.5l-7 7c-.7.7-1.69 0-2.5 0a2.5 2.5 0 0 0 0 5c.28 0 .5.22.5.5a2.5 2.5 0 1 0 5 0c0-.81-.7-1.8 0-2.5Z"/></Ic>;
const IcMoon=({s,c})=><Ic s={s} c={c}><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></Ic>;
const IcSun=({s,c})=><Ic s={s} c={c}><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></Ic>;
const IcBell=({s,c})=><Ic s={s} c={c}><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></Ic>;

const TABS=["تحليل الأعراض","قراءة التحاليل","تحليل الأشعة"];
const TAB_ICONS=[IcActivity,IcPill,IcFileText];

const CHAT=[
  {role:"ai",text:"مرحباً بك في المساعد الطبي الذكي لـ HealPath! يمكنني مساعدتك في تحليل أعراضك، قراءة نتائج التحاليل، أو تفسير الأشعة. كيف يمكنني مساعدتك اليوم؟"},
  {role:"user",text:"عندي ألم في الركبة اليمنى وصعوبة في المشي منذ أسبوع تقريباً."},
  {role:"ai",text:"شكراً على المعلومات. بناءً على الأعراض التي ذكرتها، قمت بتحليلها وهذه نتائجي الأولية:",type:"analysis"},
];

function App(){
  const [dark,setDark]=useState(false);
  const [activeTab,setActiveTab]=useState(0);
  const [input,setInput]=useState("");
  const [chat,setChat]=useState(CHAT);

  const bg=dark?"#0F1621":"#FFFFFF";
  const bg2=dark?"#1A2332":"#F0F6FF";
  const card=dark?"#1E2A3A":"#FFFFFF";
  const text=dark?"#E8F0FE":"#1A1A2E";
  const text2=dark?"#94A3B8":"#6B7280";
  const border=dark?"#2A3A4A":"#E5EEFF";

  const sendMsg=()=>{
    if(!input.trim())return;
    const newChat=[...chat,{role:"user",text:input}];
    setChat([...newChat,{role:"ai",text:"جاري التحليل... سأرد عليك خلال لحظات. يُرجى الانتظار.",type:"thinking"}]);
    setInput("");
    setTimeout(()=>{
      setChat([...newChat,{role:"ai",text:"بناءً على ما ذكرت، يُنصح باستشارة طبيب متخصص لتقييم دقيق.",type:"simple"}]);
    },1500);
  };

  return(
    <div dir="rtl" style={{background:bg,color:text,minHeight:"100vh",fontFamily:"'Cairo',sans-serif",display:"flex",flexDirection:"column"}}>
      {/* NAV */}
      <nav style={{background:"#1A1A2E",position:"sticky",top:0,zIndex:50,borderBottom:"1px solid #0A1628"}}>
        <div style={{maxWidth:1280,margin:"0 auto",padding:"0 24px",height:64,display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <div style={{width:36,height:36,background:"linear-gradient(135deg,#0066FF,#00A3FF)",borderRadius:10,display:"flex",alignItems:"center",justifyContent:"center"}}>
              <svg width="20" height="14" viewBox="0 0 22 16" fill="none"><path d="M1 8 L4 8 L6 3 L8 13 L10 6 L12 10 L14 8 L21 8" stroke="white" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>
            </div>
            <div><div style={{color:"white",fontWeight:800,fontSize:17,lineHeight:1}}>HealPath</div><div style={{color:"#60A5FA",fontSize:10}}>مسار الشفاء</div></div>
          </div>
          <div style={{display:"flex",gap:4}}>
            {["الرئيسية","الأطباء","الصيدلية","التوظيف","المقالات"].map((l,i)=>(
              <a key={i} href="#" style={{color:"#CBD5E1",padding:"6px 14px",borderRadius:8,fontSize:14,textDecoration:"none"}}>{l}</a>
            ))}
          </div>
          <div style={{display:"flex",gap:8}}>
            <button onClick={()=>setDark(!dark)} style={{width:36,height:36,background:"rgba(255,255,255,0.1)",border:"1px solid rgba(255,255,255,0.15)",borderRadius:8,display:"flex",alignItems:"center",justifyContent:"center"}}>
              {dark?<IcSun s={16} c="white"/>:<IcMoon s={16} c="white"/>}
            </button>
            <button style={{position:"relative",width:36,height:36,background:"rgba(255,255,255,0.1)",border:"1px solid rgba(255,255,255,0.15)",borderRadius:8,display:"flex",alignItems:"center",justifyContent:"center"}}>
              <IcBell s={16} c="white"/>
              <span style={{position:"absolute",top:5,left:5,width:7,height:7,background:"#EF4444",borderRadius:"50%"}}/>
            </button>
            <button style={{background:"transparent",border:"1px solid rgba(255,255,255,0.3)",color:"white",padding:"7px 16px",borderRadius:8,fontSize:13,fontWeight:600}}>تسجيل الدخول</button>
          </div>
        </div>
      </nav>

      {/* CONTENT */}
      <div style={{flex:1,display:"flex",maxWidth:1200,margin:"0 auto",width:"100%",padding:"32px 24px",gap:24}}>
        {/* LEFT */}
        <div style={{flex:1,display:"flex",flexDirection:"column",minHeight:0}}>
          {/* HEADER */}
          <div style={{background:"linear-gradient(135deg,#1A1A2E,#0F3460)",borderRadius:20,padding:"24px 28px",marginBottom:20}}>
            <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:8}}>
              <div style={{width:48,height:48,background:"linear-gradient(135deg,#0066FF,#00A3FF)",borderRadius:14,display:"flex",alignItems:"center",justifyContent:"center"}}>
                <IcBrain s={24} c="white"/>
              </div>
              <div>
                <div style={{color:"white",fontWeight:800,fontSize:20}}>المساعد الطبي الذكي</div>
                <div style={{display:"flex",alignItems:"center",gap:6,marginTop:2}}>
                  <div style={{width:8,height:8,background:"#10B981",borderRadius:"50%"}}/>
                  <span style={{color:"#60A5FA",fontSize:12}}>متصل ويعمل</span>
                </div>
              </div>
            </div>
            <p style={{color:"#94A3B8",fontSize:14,lineHeight:1.7}}>مساعد طبي ذكي يحلل أعراضك ويقرأ نتائج التحاليل. تنبيه: هذا تحليل استرشادي لا يغني عن استشارة الطبيب.</p>
          </div>

          {/* TABS */}
          <div style={{display:"flex",gap:2,marginBottom:16,background:bg2,border:`1px solid ${border}`,borderRadius:14,padding:4}}>
            {TABS.map((tab,i)=>{
              const Icon=TAB_ICONS[i];
              const act=activeTab===i;
              return(
                <button key={i} onClick={()=>setActiveTab(i)} style={{flex:1,padding:"10px 8px",borderRadius:10,border:"none",display:"flex",alignItems:"center",justifyContent:"center",gap:6,background:act?"linear-gradient(135deg,#0066FF,#0052CC)":"transparent",color:act?"white":text2,fontFamily:"'Cairo',sans-serif",fontSize:13,fontWeight:act?700:500,boxShadow:act?"0 4px 12px rgba(0,102,255,0.3)":"none"}}>
                  <Icon s={15} c={act?"white":text2}/>{tab}
                </button>
              );
            })}
          </div>

          {/* CHAT */}
          <div style={{flex:1,background:bg2,border:`1px solid ${border}`,borderRadius:16,padding:20,display:"flex",flexDirection:"column",gap:16,minHeight:360,overflowY:"auto",marginBottom:14}}>
            {chat.map((msg,i)=>(
              <div key={i}>
                {msg.role==="ai"?(
                  <div style={{display:"flex",gap:10,alignItems:"flex-start"}}>
                    <div style={{width:34,height:34,background:"linear-gradient(135deg,#0066FF,#00A3FF)",borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                      <IcBrain s={16} c="white"/>
                    </div>
                    <div>
                      <div style={{background:dark?"#1E2A3A":"#EEF4FF",borderRadius:"0 16px 16px 16px",padding:"12px 16px",maxWidth:480,fontSize:14,color:text,lineHeight:1.7}}>
                        {msg.text}
                      </div>
                      {msg.type==="analysis"&&(
                        <div style={{marginTop:10,background:card,border:`1px solid ${border}`,borderRadius:14,padding:16,maxWidth:480}}>
                          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12}}>
                            <div style={{width:32,height:32,background:"rgba(0,102,255,0.1)",borderRadius:10,display:"flex",alignItems:"center",justifyContent:"center"}}>
                              <IcBone s={16} c="#0066FF"/>
                            </div>
                            <div>
                              <div style={{fontWeight:800,color:"#0066FF",fontSize:15}}>قسم العظمية</div>
                              <div style={{fontSize:11,color:text2}}>احتمال تشخيص: 85%</div>
                            </div>
                          </div>
                          <div style={{background:bg2,borderRadius:10,padding:12,marginBottom:12}}>
                            <div style={{fontSize:13,fontWeight:700,marginBottom:4}}>الطبيب المقترح</div>
                            <div style={{fontSize:13,color:text2}}>د. محمد الأحمد — استشاري جراحة العظام — 12 سنة خبرة</div>
                          </div>
                          <div style={{fontSize:12,color:"#F59E0B",marginBottom:14,display:"flex",alignItems:"center",gap:4}}>
                            ⚠️ هذا تحليل استرشادي ولا يُغني عن زيارة الطبيب
                          </div>
                          <button style={{width:"100%",background:"linear-gradient(135deg,#0066FF,#0052CC)",color:"white",border:"none",padding:10,borderRadius:10,fontSize:13,fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
                            <IcCalendar s={14} c="white"/>احجز موعداً الآن
                          </button>
                        </div>
                      )}
                    </div>
                  </div>
                ):(
                  <div style={{display:"flex",justifyContent:"flex-end"}}>
                    <div style={{background:"linear-gradient(135deg,#0066FF,#0052CC)",borderRadius:"16px 0 16px 16px",padding:"12px 16px",maxWidth:400,fontSize:14,color:"white",lineHeight:1.7}}>
                      {msg.text}
                    </div>
                  </div>
                )}
              </div>
            ))}
          </div>

          {/* INPUT */}
          <div style={{display:"flex",gap:10,alignItems:"center"}}>
            <button style={{width:44,height:44,background:bg2,border:`1px solid ${border}`,borderRadius:12,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
              <IcImage s={18} c={text2}/>
            </button>
            <input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&sendMsg()} placeholder="اكتب أعراضك أو سؤالك الطبي هنا..." style={{flex:1,background:bg2,border:`1px solid ${border}`,borderRadius:12,padding:"12px 16px",fontSize:14,color:text,outline:"none",fontFamily:"'Cairo',sans-serif",direction:"rtl"}}/>
            <button onClick={sendMsg} style={{width:44,height:44,background:"linear-gradient(135deg,#0066FF,#0052CC)",border:"none",borderRadius:12,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,boxShadow:"0 4px 12px rgba(0,102,255,0.4)"}}>
              <IcSend s={18} c="white"/>
            </button>
          </div>
        </div>

        {/* RIGHT */}
        <div style={{width:280,flexShrink:0}}>
          <div style={{background:card,border:`1px solid ${border}`,borderRadius:16,padding:20,marginBottom:20}}>
            <div style={{fontWeight:800,fontSize:15,marginBottom:16}}>قدرات المساعد</div>
            {[
              {Icon:IcActivity,color:"#0066FF",title:"تحليل الأعراض",desc:"تشخيص أولي بدقة 85%+"},
              {Icon:IcPill,color:"#10B981",title:"قراءة التحاليل",desc:"قراءة نتائج الدم والبول"},
              {Icon:IcFileText,color:"#8B5CF6",title:"تحليل الأشعة",desc:"أشعة سينية وRMI"},
            ].map((feat,i)=>(
              <div key={i} style={{display:"flex",gap:12,marginBottom:i<2?16:0,padding:12,background:bg2,borderRadius:12,border:`1px solid ${border}`}}>
                <div style={{width:36,height:36,background:`${feat.color}18`,borderRadius:10,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                  <feat.Icon s={16} c={feat.color}/>
                </div>
                <div>
                  <div style={{fontWeight:700,fontSize:13,marginBottom:2}}>{feat.title}</div>
                  <div style={{fontSize:12,color:text2}}>{feat.desc}</div>
                </div>
              </div>
            ))}
          </div>

          <div style={{background:"linear-gradient(135deg,#1A1A2E,#0F3460)",borderRadius:16,padding:20}}>
            <div style={{fontWeight:800,fontSize:15,color:"white",marginBottom:12}}>تنبيه طبي مهم</div>
            <p style={{color:"#94A3B8",fontSize:13,lineHeight:1.7,marginBottom:16}}>المساعد الذكي يقدم تحليلاً استرشادياً أولياً فقط ولا يحل محل الطبيب المتخصص.</p>
            <button style={{width:"100%",background:"linear-gradient(135deg,#0066FF,#0052CC)",color:"white",border:"none",padding:10,borderRadius:10,fontSize:13,fontWeight:700}}>احجز مع طبيب الآن</button>
          </div>
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
