<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HealPath — الصفحة الرئيسية</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>*{margin:0;padding:0;box-sizing:border-box}body{overflow-x:hidden}::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:rgba(0,102,255,0.3);border-radius:3px}button{cursor:pointer}a{text-decoration:none}</style>
</head>
<body><div id="root"></div>
<script type="text/babel">
const {useState}=React;

const Ic=({c,s=20,children,...r})=>(
  <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c||"currentColor"} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{flexShrink:0,...(r.style||{})}} {...r}>{children}</svg>
);
const IcActivity=({s,c})=><Ic s={s} c={c}><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></Ic>;
const IcBrain=({s,c})=><Ic s={s} c={c}><path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96-.46 2.5 2.5 0 0 1-1.49-4.26A3 3 0 0 1 5 14V8a3 3 0 0 1 .05-.52A2.5 2.5 0 0 1 7.5 2Z"/><path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96-.46 2.5 2.5 0 0 0 1.49-4.26A3 3 0 0 0 19 14V8a3 3 0 0 0-.05-.52A2.5 2.5 0 0 0 16.5 2Z"/></Ic>;
const IcCalendar=({s,c})=><Ic s={s} c={c}><rect width="18" height="18" x="3" y="4" rx="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></Ic>;
const IcBell=({s,c})=><Ic s={s} c={c}><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></Ic>;
const IcMoon=({s,c})=><Ic s={s} c={c}><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></Ic>;
const IcSun=({s,c})=><Ic s={s} c={c}><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></Ic>;
const IcGlobe=({s,c})=><Ic s={s} c={c}><circle cx="12" cy="12" r="10"/><line x1="2" x2="22" y1="12" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></Ic>;
const IcBone=({s,c})=><Ic s={s} c={c}><path d="M17 10c.7-.7 1.69 0 2.5 0a2.5 2.5 0 1 0 0-5 .5.5 0 0 1-.5-.5 2.5 2.5 0 1 0-5 0c0 .81.7 1.8 0 2.5l-7 7c-.7.7-1.69 0-2.5 0a2.5 2.5 0 0 0 0 5c.28 0 .5.22.5.5a2.5 2.5 0 1 0 5 0c0-.81-.7-1.8 0-2.5Z"/></Ic>;
const IcWind=({s,c})=><Ic s={s} c={c}><path d="M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2"/><path d="M9.6 4.6A2 2 0 1 1 11 8H2"/><path d="M12.6 19.4A2 2 0 1 0 14 16H2"/></Ic>;
const IcDroplets=({s,c})=><Ic s={s} c={c}><path d="M7 16.3c2.2 0 4-1.83 4-4.05 0-1.16-.57-2.26-1.71-3.19S7.29 6.75 7 5.3c-.29 1.45-1.14 2.84-2.29 3.76S3 11.1 3 12.25c0 2.22 1.8 4.05 4 4.05z"/><path d="M12.56 6.6A10.97 10.97 0 0 0 14 3.02c.5 2.5 2 4.9 4 6.5s3 3.5 3 5.5a6.98 6.98 0 0 1-11.91 4.97"/></Ic>;
const IcHeart=({s,c})=><Ic s={s} c={c}><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></Ic>;
const IcPill=({s,c})=><Ic s={s} c={c}><path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z"/><path d="m8.5 8.5 7 7"/></Ic>;
const IcFileText=({s,c})=><Ic s={s} c={c}><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></Ic>;
const IcX=({s,c})=><Ic s={s} c={c}><path d="M18 6 6 18M6 6l12 12"/></Ic>;
const IcCheckCircle=({s,c})=><Ic s={s} c={c}><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></Ic>;

const Logo=()=>(
  <div style={{display:"flex",alignItems:"center",gap:10}}>
    <div style={{width:38,height:38,background:"linear-gradient(135deg,#0066FF,#00A3FF)",borderRadius:10,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
      <svg width="22" height="16" viewBox="0 0 22 16" fill="none"><path d="M1 8 L4 8 L6 3 L8 13 L10 6 L12 10 L14 8 L21 8" stroke="white" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>
    </div>
    <div>
      <div style={{color:"white",fontWeight:800,fontSize:18,lineHeight:1,fontFamily:"Inter,sans-serif"}}>HealPath</div>
      <div style={{color:"#60A5FA",fontSize:10,fontWeight:500}}>مسار الشفاء</div>
    </div>
  </div>
);

const deptIcons=[IcBone,IcWind,IcDroplets,IcHeart,IcBrain];
const deptColors=["#3B82F6","#10B981","#8B5CF6","#EF4444","#F59E0B"];
const depts=["العظمية","الصدرية","الكلى","القلبية","العصبية"];
const deptsDesc=["أمراض وجراحات العظام","أمراض الجهاز التنفسي","أمراض الكلى والمسالك","أمراض القلب والأوعية","أمراض الجهاز العصبي"];

function App(){
  const [dark,setDark]=useState(false);
  const [aiOpen,setAiOpen]=useState(false);
  const bg=dark?"#0F1621":"#FFFFFF";
  const bg2=dark?"#1A2332":"#F0F6FF";
  const card=dark?"#1E2A3A":"#FFFFFF";
  const text=dark?"#E8F0FE":"#1A1A2E";
  const text2=dark?"#94A3B8":"#6B7280";
  const border=dark?"#2A3A4A":"#E5EEFF";
  const nav="#1A1A2E";

  return(
    <div dir="rtl" style={{background:bg,color:text,minHeight:"100vh",fontFamily:"'Cairo',sans-serif",transition:"background 0.3s"}}>
      {/* NAVBAR */}
      <nav style={{background:nav,position:"sticky",top:0,zIndex:50,borderBottom:"1px solid #0A1628"}}>
        <div style={{maxWidth:1280,margin:"0 auto",padding:"0 24px",height:64,display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <Logo/>
          <div style={{display:"flex",alignItems:"center",gap:4}}>
            {["الرئيسية","الأطباء","الصيدلية","التوظيف","المقالات"].map((l,i)=>(
              <a key={i} href="#" style={{color:i===0?"#60A5FA":"#CBD5E1",padding:"6px 14px",borderRadius:8,fontSize:14,fontWeight:500,background:i===0?"rgba(96,165,250,0.12)":"transparent"}}>{l}</a>
            ))}
          </div>
          <div style={{display:"flex",alignItems:"center",gap:8}}>
            <button onClick={()=>setDark(!dark)} style={{width:36,height:36,background:"rgba(255,255,255,0.1)",border:"1px solid rgba(255,255,255,0.15)",borderRadius:8,color:"white",display:"flex",alignItems:"center",justifyContent:"center"}}>
              {dark?<IcSun s={16} c="white"/>:<IcMoon s={16} c="white"/>}
            </button>
            <button style={{background:"rgba(255,255,255,0.1)",border:"1px solid rgba(255,255,255,0.15)",borderRadius:8,width:36,height:36,color:"white",position:"relative",display:"flex",alignItems:"center",justifyContent:"center"}}>
              <IcBell s={16} c="white"/>
              <span style={{position:"absolute",top:6,left:6,width:7,height:7,background:"#EF4444",borderRadius:"50%"}}/>
            </button>
            <button style={{background:"transparent",border:"1px solid rgba(255,255,255,0.3)",color:"white",padding:"7px 16px",borderRadius:8,fontSize:13,fontWeight:600}}>تسجيل الدخول</button>
            <button style={{background:"linear-gradient(135deg,#0066FF,#0052CC)",border:"none",color:"white",padding:"7px 16px",borderRadius:8,fontSize:13,fontWeight:600,boxShadow:"0 2px 12px rgba(0,102,255,0.4)"}}>إنشاء حساب</button>
          </div>
        </div>
      </nav>

      {/* HERO */}
      <section style={{background:"linear-gradient(135deg,#1A1A2E,#0F3460)",padding:"88px 24px 64px",textAlign:"center",position:"relative",overflow:"hidden"}}>
        <div style={{position:"absolute",inset:0,backgroundImage:"linear-gradient(rgba(0,102,255,0.05) 1px,transparent 1px),linear-gradient(90deg,rgba(0,102,255,0.05) 1px,transparent 1px)",backgroundSize:"40px 40px",pointerEvents:"none"}}/>
        <div style={{display:"inline-flex",alignItems:"center",gap:8,background:"rgba(0,102,255,0.15)",border:"1px solid rgba(0,102,255,0.3)",borderRadius:20,padding:"6px 16px",marginBottom:24}}>
          <IcActivity s={14} c="#60A5FA"/>
          <span style={{color:"#60A5FA",fontSize:13,fontWeight:600}}>مدعوم بالذكاء الاصطناعي</span>
        </div>
        <h1 style={{color:"white",fontSize:52,fontWeight:800,marginBottom:20,lineHeight:1.2,position:"relative"}}>مسار شفائك يبدأ هنا</h1>
        <p style={{color:"#94A3B8",fontSize:18,maxWidth:600,margin:"0 auto 36px",lineHeight:1.8}}>منصة طبية ذكية تجمع حجز المواعيد والذكاء الاصطناعي في مكان واحد</p>
        <div style={{display:"flex",gap:12,justifyContent:"center",flexWrap:"wrap"}}>
          <button style={{background:"linear-gradient(135deg,#0066FF,#0052CC)",color:"white",border:"none",padding:"14px 32px",borderRadius:12,fontSize:16,fontWeight:700,boxShadow:"0 4px 20px rgba(0,102,255,0.4)",display:"flex",alignItems:"center",gap:8}}>
            <IcCalendar s={18} c="white"/>احجز موعداً الآن
          </button>
          <button style={{background:"transparent",color:"white",border:"2px solid rgba(255,255,255,0.3)",padding:"14px 32px",borderRadius:12,fontSize:16,fontWeight:700,display:"flex",alignItems:"center",gap:8}}>
            <IcBrain s={18} c="white"/>جرّب المساعد الذكي
          </button>
        </div>
        <div style={{display:"flex",gap:16,justifyContent:"center",marginTop:48,flexWrap:"wrap"}}>
          {[["500+","مريض مسجل"],["5","قسم طبي"],["20+","طبيب متخصص"]].map(([v,l],i)=>(
            <div key={i} style={{background:"rgba(255,255,255,0.07)",border:"1px solid rgba(255,255,255,0.12)",borderRadius:16,padding:"16px 28px",textAlign:"center"}}>
              <div style={{color:"#60A5FA",fontSize:28,fontWeight:800}}>{v}</div>
              <div style={{color:"#94A3B8",fontSize:13,marginTop:4}}>{l}</div>
            </div>
          ))}
        </div>
      </section>

      {/* DEPARTMENTS */}
      <section style={{background:bg2,padding:"64px 24px"}}>
        <div style={{maxWidth:1200,margin:"0 auto"}}>
          <h2 style={{textAlign:"center",fontSize:32,fontWeight:800,marginBottom:8}}>أقسامنا الطبية</h2>
          <div style={{width:48,height:4,background:"linear-gradient(90deg,#0066FF,#00A3FF)",borderRadius:2,margin:"0 auto 40px"}}/>
          <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:16}}>
            {depts.map((name,i)=>{const Icon=deptIcons[i];return(
              <div key={i} style={{background:card,border:`1px solid ${border}`,borderRadius:16,padding:"24px 16px",textAlign:"center",cursor:"pointer",boxShadow:dark?"none":"0 2px 12px rgba(0,0,0,0.06)"}}>
                <div style={{width:56,height:56,background:`${deptColors[i]}18`,borderRadius:16,display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 14px"}}>
                  <Icon s={26} c={deptColors[i]}/>
                </div>
                <div style={{fontWeight:700,fontSize:15,marginBottom:6}}>{name}</div>
                <div style={{fontSize:12,color:text2,lineHeight:1.5}}>{deptsDesc[i]}</div>
              </div>
            )})}
          </div>
        </div>
      </section>

      {/* DOCTORS */}
      <section style={{background:bg,padding:"64px 24px"}}>
        <div style={{maxWidth:1200,margin:"0 auto"}}>
          <h2 style={{textAlign:"center",fontSize:32,fontWeight:800,marginBottom:8}}>نخبة من الأطباء المتخصصين</h2>
          <div style={{width:48,height:4,background:"linear-gradient(90deg,#0066FF,#00A3FF)",borderRadius:2,margin:"0 auto 40px"}}/>
          <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:24}}>
            {[
              {name:"د. محمد الأحمد",spec:"استشاري جراحة العظام",exp:"12 سنة خبرة",init:"م.أ",rating:4.8,reviews:124},
              {name:"د. سارة خليل",spec:"أخصائية أمراض القلب",exp:"8 سنوات خبرة",init:"س.خ",rating:4.9,reviews:89},
              {name:"د. أحمد ياسين",spec:"استشاري جراحة الأعصاب",exp:"15 سنة خبرة",init:"أ.ي",rating:4.7,reviews:210},
            ].map((doc,i)=>(
              <div key={i} style={{background:card,border:`1px solid ${border}`,borderRadius:20,padding:24,textAlign:"center",boxShadow:dark?"none":"0 2px 12px rgba(0,0,0,0.06)"}}>
                <div style={{width:80,height:80,background:"linear-gradient(135deg,#0066FF,#00A3FF)",borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 16px",fontSize:22,color:"white",fontWeight:800}}>{doc.init}</div>
                <div style={{fontWeight:800,fontSize:17,marginBottom:4}}>{doc.name}</div>
                <div style={{color:"#0066FF",fontSize:13,fontWeight:600,marginBottom:8}}>{doc.spec}</div>
                <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:12,marginBottom:16}}>
                  <span style={{background:bg2,color:text2,fontSize:12,padding:"4px 10px",borderRadius:20}}>{doc.exp}</span>
                  <span style={{color:"#F59E0B",fontSize:13,fontWeight:700}}>★ {doc.rating}</span>
                </div>
                <button style={{width:"100%",background:"linear-gradient(135deg,#0066FF,#0052CC)",color:"white",border:"none",padding:"10px",borderRadius:10,fontSize:14,fontWeight:700}}>احجز موعداً</button>
              </div>
            ))}
          </div>
        </div>
      </section>

      {/* AI SECTION */}
      <section style={{background:"#1A1A2E",padding:"64px 24px"}}>
        <div style={{maxWidth:1200,margin:"0 auto",textAlign:"center"}}>
          <div style={{display:"inline-flex",alignItems:"center",gap:8,background:"rgba(0,102,255,0.2)",border:"1px solid rgba(0,102,255,0.3)",borderRadius:20,padding:"6px 16px",marginBottom:20}}>
            <IcBrain s={14} c="#60A5FA"/><span style={{color:"#60A5FA",fontSize:12,fontWeight:600}}>AI-Powered</span>
          </div>
          <h2 style={{color:"white",fontSize:32,fontWeight:800,marginBottom:10}}>المساعد الطبي الذكي</h2>
          <p style={{color:"#94A3B8",fontSize:16,marginBottom:48}}>اكتب أعراضك وسيوجهك الذكاء الاصطناعي للقسم والطبيب المناسب</p>
          <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:20}}>
            {[
              {label:"تحليل الأعراض",desc:"أدخل أعراضك ونوجهك للتخصص المناسب",Icon:IcActivity},
              {label:"قراءة التحاليل",desc:"ارفع صورة التحليل للقراءة الأولية",Icon:IcPill},
              {label:"تحليل الأشعة",desc:"ارفع صورة الأشعة للتحليل الذكي",Icon:IcFileText},
            ].map((feat,i)=>(
              <div key={i} style={{background:"rgba(255,255,255,0.05)",border:"1px solid rgba(255,255,255,0.1)",borderRadius:20,padding:"32px 24px",textAlign:"center"}}>
                <div style={{width:64,height:64,background:"rgba(0,102,255,0.15)",border:"1px solid rgba(0,102,255,0.3)",borderRadius:20,display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 18px"}}>
                  <feat.Icon s={28} c="#60A5FA"/>
                </div>
                <div style={{color:"white",fontWeight:700,fontSize:17,marginBottom:10}}>{feat.label}</div>
                <div style={{color:"#94A3B8",fontSize:14,lineHeight:1.7}}>{feat.desc}</div>
              </div>
            ))}
          </div>
        </div>
      </section>

      {/* FOOTER */}
      <footer style={{background:"#0D1117",padding:"32px 24px",textAlign:"center"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:10,marginBottom:12}}>
          <div style={{width:32,height:32,background:"linear-gradient(135deg,#0066FF,#00A3FF)",borderRadius:8,display:"flex",alignItems:"center",justifyContent:"center"}}>
            <svg width="18" height="13" viewBox="0 0 22 16" fill="none"><path d="M1 8 L4 8 L6 3 L8 13 L10 6 L12 10 L14 8 L21 8" stroke="white" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>
          </div>
          <span style={{color:"white",fontWeight:700,fontSize:16}}>HealPath</span>
        </div>
        <p style={{color:"#475569",fontSize:13}}>© 2026 HealPath — جميع الحقوق محفوظة</p>
      </footer>

      {/* AI FLOAT */}
      <div style={{position:"fixed",bottom:28,left:28,zIndex:100}}>
        <div style={{position:"absolute",inset:-6,borderRadius:"50%",background:"rgba(0,102,255,0.25)",animation:"pulse 2s ease-out infinite"}}/>
        <button onClick={()=>setAiOpen(!aiOpen)} style={{width:56,height:56,background:"linear-gradient(135deg,#0066FF,#0052CC)",border:"none",borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",boxShadow:"0 4px 24px rgba(0,102,255,0.5)",position:"relative"}}>
          {aiOpen?<IcX s={20} c="white"/>:<IcBrain s={20} c="white"/>}
        </button>
        <div style={{textAlign:"center",marginTop:6,color:"#0066FF",fontSize:10,fontWeight:700}}>المساعد الطبي</div>
      </div>

      {/* AI DRAWER */}
      {aiOpen&&(
        <div style={{position:"fixed",inset:0,zIndex:99}}>
          <div onClick={()=>setAiOpen(false)} style={{position:"absolute",inset:0,background:"rgba(0,0,0,0.45)",backdropFilter:"blur(2px)"}}/>
          <div style={{position:"absolute",top:0,bottom:0,right:0,width:380,background:dark?"#1E2A3A":"#FFFFFF",boxShadow:"-4px 0 32px rgba(0,0,0,0.3)",display:"flex",flexDirection:"column"}}>
            <div style={{background:"linear-gradient(135deg,#1A1A2E,#0F3460)",padding:"18px 20px",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
              <div style={{display:"flex",alignItems:"center",gap:10}}>
                <div style={{width:36,height:36,background:"rgba(0,102,255,0.3)",borderRadius:10,display:"flex",alignItems:"center",justifyContent:"center"}}>
                  <IcBrain s={18} c="#60A5FA"/>
                </div>
                <div>
                  <div style={{color:"white",fontWeight:700,fontSize:15}}>المساعد الطبي الذكي</div>
                  <div style={{color:"#60A5FA",fontSize:11}}>● متصل</div>
                </div>
              </div>
              <button onClick={()=>setAiOpen(false)} style={{background:"rgba(255,255,255,0.1)",border:"none",color:"white",width:30,height:30,borderRadius:8,display:"flex",alignItems:"center",justifyContent:"center"}}>
                <IcX s={16} c="white"/>
              </button>
            </div>
            <div style={{flex:1,overflowY:"auto",padding:16,display:"flex",flexDirection:"column",gap:12}}>
              <div style={{display:"flex",gap:8}}>
                <div style={{width:30,height:30,background:"linear-gradient(135deg,#0066FF,#00A3FF)",borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                  <IcBrain s={14} c="white"/>
                </div>
                <div style={{background:dark?"#1A2332":"#EEF4FF",borderRadius:"0 14px 14px 14px",padding:"12px 14px",maxWidth:"80%",fontSize:13,color:dark?"#E8F0FE":"#1A1A2E",lineHeight:1.6}}>
                  مرحباً! أخبرني عن أعراضك وسأساعدك في التوجه للقسم المناسب.
                </div>
              </div>
              <div style={{display:"flex",justifyContent:"flex-end"}}>
                <div style={{background:"linear-gradient(135deg,#0066FF,#0052CC)",borderRadius:"14px 0 14px 14px",padding:"12px 14px",maxWidth:"80%",fontSize:13,color:"white",lineHeight:1.6}}>
                  عندي ألم في الركبة اليمنى وصعوبة في المشي منذ أسبوع.
                </div>
              </div>
              <div style={{display:"flex",gap:8}}>
                <div style={{width:30,height:30,background:"linear-gradient(135deg,#0066FF,#00A3FF)",borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                  <IcBrain s={14} c="white"/>
                </div>
